# demo 业务系统 + 遥测底座（M0）
# 被观测目标与 P/L/G 栈的编排；设计见 docs/design/m0-environment-design.md（D-12：不进 src/oncall）
name: oncall-demo

# loki logging driver 需要：docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
# 注意：日志插件运行在宿主 daemon 网络，解析不了 compose 服务名，loki-url 必须走宿主发布的端口
x-demo-logging: &demo-logging
  driver: loki
  options:
    loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
    loki-retries: "3"
    loki-batch-size: "100"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: oncall
      MYSQL_DATABASE: demo
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-poncall"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  api-gw:
    build:
      context: ./demo
      dockerfile: Dockerfile.api-gw
    environment:
      DATABASE_URL: mysql+pymysql://root:oncall@mysql:3306/demo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "8000:8000"
    logging: *demo-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0 if r.status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./demo
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: mysql+pymysql://root:oncall@mysql:3306/demo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    logging: *demo-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki

  # ── 告警链路（issue 03）：Prometheus 规则评估 → Alertmanager → webhook 落 JSONL ──
  prometheus:
    image: prom/prometheus:v3.4.1
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      # receiver 三档开关（M1 issue 06 / G6，默认 dump 档 = 现状/回退）：
      #   双写档（dump + oncall 过渡）:
      #     ONCALL_AM_CONFIG=alertmanager-dual.yml docker-compose up -d alertmanager
      #   oncall 档（切稳后关 dump）:
      #     ONCALL_AM_CONFIG=alertmanager-oncall.yml docker-compose up -d alertmanager
      #   回退 dump 档: 不带变量 up -d alertmanager 即可
      - ./deploy/alertmanager/${ONCALL_AM_CONFIG:-alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  alert-dumper:
    build:
      context: ./deploy/alert-dumper
    environment:
      DUMP_PATH: /alerts/alerts-dump.jsonl
    volumes:
      # 追加写宿主 deploy/alerts-dump.jsonl（运行时产物，已 gitignore）
      - ./deploy:/alerts

  # ── oncall ingest（M1 issue 06 收编）：Alertmanager receiver 的目标端点 ──
  # 依赖随镜像装（pyproject 锁版本），源码直挂 /app/src——改代码 restart 即可；
  # 仓库根挂 /app/repo 使 oncall.db 宿主可见（与宿主 uvicorn 开发形态同库）。
  oncall:
    build:
      context: .
      dockerfile: deploy/oncall/Dockerfile
    environment:
      ONCALL_DATABASE_URL: sqlite:////app/repo/oncall.db
      ONCALL_PROMETHEUS_URL: http://prometheus:9090
      # 真实 LLM 通道（M2 issue 07）：三件套默认空 = 未配置，/classify 落 503，
      # ingest 主链路零 LLM 依赖不受影响（R6）。key 只从宿主环境注入，**不入库**：
      #   source ~/.oncall-llm-env && docker-compose up -d oncall
      # dev_dir 指容器内的仓库挂载点（few-shot 只读 dev 集，holdout 禁看）
      ONCALL_LLM_API_KEY: ${ONCALL_LLM_API_KEY:-}
      ONCALL_LLM_BASE_URL: ${ONCALL_LLM_BASE_URL:-}
      ONCALL_LLM_MODEL: ${ONCALL_LLM_MODEL:-}
      ONCALL_GOLDEN_DEV_DIR: /app/repo/datasets/golden/dev
    volumes:
      - ./src:/app/src
      - ./:/app/repo
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; r = urllib.request.urlopen('http://127.0.0.1:8010/alerts?limit=1', timeout=3); sys.exit(0 if r.status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  mysql-data:
  prometheus-data:
