# 黄金集草稿（issue 05）——预标注初稿待人工核对，核对记录写入 issue Comments
# 场景: 进程被杀（Pumba SIGKILL worker 主进程）（故障类）
# 数据源: deploy/alerts-dump.jsonl 实测切片（fired_at/resolved_at 未编造）
# 标注状态: DRAFT（Agent 初稿）→ 待人工抽核 → 双签回填

scenario: process-killed
root_cause: pumba kill 向 worker 容器 PID 1 发 SIGKILL，容器 ExitCode=137 退出且无重启策略，消费能力瞬间归零而提交侧持续灌任务，队列深度越过
  20 后持续增长（实测 12 线程探针下净增 ~24/s）；积压任务即滞留 pending，DemoTasksStuckPending 随之触发；与 OOM 剧本区分点——被杀的是消费端（ExitCode=137
  实测确认），提交面完全正常
investigation_path:
- 查容器退出码与重启事件确认 137（SIGKILL）
- 查任务积压回升确认消费端缺位
- docker inspect 查 OOMKilled=false 排除内存因素（区别于剧本 03）
remediation: 先移除 Pumba（kill 值守循环）再重启 worker，恢复后以约 9/s 消化积压
runs:
- started_at: '2026-09-06T13:14:23Z'
  recovered_at: '2026-09-06T13:23:11Z'
  alert_timeline:
  - alert_name: DemoQueueDepthHigh
    labels:
      alertname: DemoQueueDepthHigh
      instance: api-gw:8000
      job: demo-api-gw
      severity: warning
    fired_at: '2026-09-06T13:16:36.474Z'
    resolved_at: '2026-09-06T13:22:56.474Z'
  - alert_name: DemoTasksStuckPending
    labels:
      alertname: DemoTasksStuckPending
      instance: api-gw:8000
      job: demo-api-gw
      scenario: protocol-mismatch
      severity: critical
    fired_at: '2026-09-06T13:17:36.474Z'
    resolved_at: '2026-09-06T13:22:56.474Z'
