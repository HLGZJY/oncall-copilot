# 黄金集草稿（issue 05）——预标注初稿待人工核对，核对记录写入 issue Comments
# 场景: 网络丢包（api-gw 到 MySQL 流量 25% 丢包）（网络类）
# 数据源: deploy/alerts-dump.jsonl 实测切片（fired_at/resolved_at 未编造）
# 标注状态: DRAFT（Agent 初稿）→ 待人工抽核 → 双签回填

scenario: packet-loss
root_cause: Pumba netem 对 api-gw 出方向全部流量随机丢 25% 的包（实测：Docker Desktop/WSL2 上端口过滤不生效，改全流量），TCP
  重传（RTO 200ms~1s）把 DB 查询延迟拉高且尾部抖动剧烈，与恒定延迟（剧本 04）的指标形态可区分；实测 DemoTasksHighLatency/DemoDbPoolSaturated
  先后触发，DB 变慢连带队列堆积与非 DB 路径延迟抬升
investigation_path:
- 查 /tasks P95 与 5xx 率确认延迟形态（恒定抬升 vs 尾部尖刺）
- 对比 api-gw 与 mysql 间网络指标/重传，区分延迟与丢包
- docker exec 进 api-gw 查 tc qdisc 确认 netem 注入
remediation: 停止 Pumba（SIGTERM 触发 tc qdisc 撤销）与探针，等 TCP 重传队列排空后 /tasks 延迟回落（实测清理后全部告警恢复）
runs:
- started_at: '2026-09-06T11:18:47Z'
  recovered_at: '2026-09-06T11:21:26Z'
  alert_timeline:
  - alert_name: DemoTasksHighLatency
    labels:
      alertname: DemoTasksHighLatency
      scenario: slow-sql
      severity: warning
    fired_at: '2026-09-06T11:20:01.474Z'
    resolved_at: '2026-09-06T11:21:11.474Z'
  - alert_name: DemoApiGwHighLatency
    labels:
      alertname: DemoApiGwHighLatency
      scenario: cpu-spike
      severity: warning
    fired_at: '2026-09-06T11:20:11.474Z'
    resolved_at: null
- started_at: '2026-09-06T11:23:50Z'
  recovered_at: '2026-09-06T11:26:35Z'
  alert_timeline:
  - alert_name: DemoApiGwHighLatency
    labels:
      alertname: DemoApiGwHighLatency
      scenario: cpu-spike
      severity: warning
    fired_at: '2026-09-06T11:25:06.474Z'
