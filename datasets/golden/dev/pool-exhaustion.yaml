# 黄金集草稿（issue 05）——预标注初稿待人工核对，核对记录写入 issue Comments
# 场景: 连接打满（并发读把 DB 连接池占满）（负载类）
# 数据源: deploy/alerts-dump.jsonl 实测切片（fired_at/resolved_at 未编造）
# 标注状态: DRAFT（Agent 初稿）→ 待人工抽核 → 双签回填

scenario: pool-exhaustion
root_cause: 16 进程 × 24 线程 keep-alive 连接持续读不存在任务 id（缓存必未命中），每次 GET 占用池连接做 pre_ping+PK
  查询，池 1 分钟平均占用稳定超过 70% 容量；404 流量天然 100% cache miss 连带 DemoCacheMissSpike，服务端线程池饱和连带非
  DB 路径延迟抬升触发 DemoApiGwHighLatency（级联已实测确认）；必须 keep-alive+多进程——短连接/单进程多线程下客户端开销盖过服务端，池占用只到
  3~4（实测）
investigation_path:
- 查连接池占用率与 QPS 曲线确认同步读打满池
- 确认无慢查询与锁等待排除 DB 侧因素（区别于剧本 02/06）
- 定位读负载来源并评估池容量
remediation: 停掉压测探针，连接随请求结束即时归还池，无持久状态需要恢复
runs:
- started_at: '2026-09-06T12:33:59Z'
  recovered_at: '2026-09-06T12:36:37Z'
  alert_timeline:
  - alert_name: DemoCacheMissSpike
    labels:
      alertname: DemoCacheMissSpike
      scenario: cache-avalanche
      severity: warning
    fired_at: '2026-09-06T12:35:16.474Z'
    resolved_at: null
  - alert_name: DemoDbPoolSaturated
    labels:
