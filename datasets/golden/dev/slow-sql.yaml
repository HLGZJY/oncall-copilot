    resolved_at: '2026-09-06T13:27:41.474Z'
  - alert_name: DemoHighErrorRate
    labels:
      alertname: DemoHighErrorRate
      severity: critical
    fired_at: '2026-09-06T13:27:06.474Z'
    resolved_at: '2026-09-06T13:27:41.474Z'
- started_at: '2026-09-06T13:28:20Z'
