# 黄金集草稿（issue 05）——预标注初稿待人工核对，核对记录写入 issue Comments
# 场景: 下游超时（api-gw 到 MySQL 流量被注入延迟）（网络类）
# 数据源: deploy/alerts-dump.jsonl 实测切片（fired_at/resolved_at 未编造）
# 标注状态: DRAFT（Agent 初稿）→ 待人工抽核 → 双签回填

scenario: downstream-timeout
root_cause: Pumba netem 对 api-gw 出方向全部流量注入 700ms 固定延迟（实测：Docker Desktop/WSL2 上端口过滤不生效，3s 全流量延迟会把抓取响应拖过 4s 超时导致 DemoApiGwDown 误触发、告警失明，700ms 为保住观测面的实测权衡），/tasks P95 越过 0.5s、连接池被占满；DB 变慢连带消费速率下降与非 DB 路径延迟抬升；实测触发 DemoTasksHighLatency/DemoDbPoolSaturated/DemoApiGwHighLatency 3 种，DemoQueueDepthHigh/DemoTasksStuckPending 未越 for:2m 阈值未触发——推演级联不成立，预期口径已按实测收敛
investigation_path:
- 查 /tasks P95 与 DB 查询延迟确认恒定抬升形态（区别于尾部尖刺）
- 查非 DB 路径延迟同步抬升确认全流量注入（端口过滤不生效的实测形态）
- docker exec 进 api-gw 查 tc qdisc 确认 netem delay 注入
remediation: 停止 Pumba（SIGTERM 触发 tc qdisc 撤销）与探针，等在途请求排空后 /tasks 延迟与连接池占用回落（实测清理后全部告警恢复）
runs:
- started_at: '2026-09-06T10:59:53Z'
  recovered_at: '2026-09-06T11:06:17Z'
  alert_timeline:
  - alert_name: DemoDbPoolSaturated
    labels:
      alertname: DemoDbPoolSaturated
      instance: api-gw:8000
      job: demo-api-gw
      scenario: slow-sql
      severity: warning
    fired_at: '2026-09-06T11:05:01.474Z'
    resolved_at: '2026-09-06T11:05:41.474Z'
  - alert_name: DemoTasksHighLatency
    labels:
