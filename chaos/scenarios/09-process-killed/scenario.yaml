name: process-killed
fault_type: 进程被杀（Pumba SIGKILL worker 主进程）
category: 故障类
inject: chaos/scenarios/09-process-killed/inject.sh
inject_method: pumba
cleanup: chaos/scenarios/09-process-killed/cleanup.sh
expected_alerts:
  - DemoQueueDepthHigh
  - DemoTasksStuckPending
expected_root_cause: pumba kill 向 worker 容器 PID 1 发 SIGKILL，容器 ExitCode=137 退出且无重启策略，消费能力瞬间归零而提交侧持续灌任务，队列深度越过 20 后持续增长（实测 12 线程探针下净增 ~24/s）；积压任务即滞留 pending，DemoTasksStuckPending 随之触发；与 OOM 剧本区分点——被杀的是消费端（ExitCode=137 实测确认），提交面完全正常
expected_remediation: 先移除 Pumba（kill 值守循环）再重启 worker，恢复后以约 9/s 消化积压
