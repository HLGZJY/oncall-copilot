# demo 业务系统告警规则（issue 03 起步 6 条，issue 04 补至 8 条，issue 06 补第 9 条，对应 12 个剧本）
# 纪律：每条规则的 scenario label = 剧本 slug，与 chaos/scenarios/*/scenario.yaml
# 的 expected_alerts 双向对应——剧本必须至少触发一条规则，规则必须有剧本可解释。
groups:
  - name: demo-slo
    rules:
      # ── 剧本 01-cpu-spike：CPU 飙高（Pumba cpu stress 打满 api-gw 单核）──────────
      # 机制：事件循环/线程池被饿死，非 DB 路径（/health /metrics）延迟最先失控，
      # 排除 /tasks 保证与慢 SQL 剧本的正交性；/health 走独立连接池
      # （demo/common/db.py health_engine），池饱和不会连带本规则误报。
      # 阈值 0.05s：健康负载下 P95≈5ms（10 倍裕度），CPU 饥饿 + 探针负载下 P95≈95ms。
      # 注意该直方图是服务端计时，TCP/探针侧排队不计入——叠加业务流量是必要条件，
      # 且阈值必须落在"饥饿后服务内延迟"区间，而非靠堆流量把延迟顶过任意阈值。
      - alert: DemoApiGwHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(demo_request_duration_seconds_bucket{endpoint!="/tasks"}[1m]))
          ) > 0.05
        for: 1m
        labels:
          severity: warning
          scenario: cpu-spike
        annotations:
          summary: "api-gw 非 DB 路径 P95 延迟超过 0.5s"
          description: "疑似 CPU 资源被占用导致事件循环饥饿（对应剧本 chaos/scenarios/01-cpu-spike）"

      # ── 剧本 02-slow-sql：tasks 表锁等待 ────────────────────────────────────────
      # 机制：写锁持有期间 /tasks 读写全部阻塞。两个表现择一触发即可：
      #   a) 已完成请求的 P95 直冲直方图顶格（注意：全落 +Inf 桶时 quantile 为 NaN，
      #      NaN 比较恒假，必须配 b 支路兜底）；
      #   b) 连接池（5+5）打满后新请求 30s 超时产生 5xx 流量。
      - alert: DemoTasksHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(demo_request_duration_seconds_bucket{endpoint="/tasks"}[1m]))
          ) > 0.5
          or
          sum(rate(demo_requests_total{endpoint="/tasks",status=~"5.."}[2m])) > 0.02
        for: 1m
        labels:
          severity: warning
          scenario: slow-sql
        annotations:
          summary: "api-gw /tasks 路径 P95 延迟超过 0.5s"
          description: "疑似 DB 慢查询/锁等待（对应剧本 chaos/scenarios/02-slow-sql）"

      # 慢 SQL 的伴随信号：被阻塞的请求把 SQLAlchemy 连接池（5+5）打满。
      # 口径说明（issue 04 实测修正）：纯负载型打满（剧本 08）受服务端 GIL 与
      # Docker Desktop 端口代理周期停顿影响，瞬时 used 深度抖动（5s 采样 min 可
      # 跌到 2），刚性 used>=size 会 flaky——改用 1 分钟平均占用 >=70% 池容量；
      # 慢 SQL/死锁等硬饱和形态 used 恒钉 10，两种口径下都触发，语义不变。
      - alert: DemoDbPoolSaturated
        expr: avg_over_time(demo_db_pool_used[1m]) >= demo_db_pool_size * 0.7
        for: 1m
        labels:
          severity: warning
          scenario: slow-sql
        annotations:
          summary: "DB 连接池持续高占用（1m 平均 >= 70% 池容量）"
          description: "连接被慢 SQL/锁等待长期占用或读流量过载，新请求将排队甚至超时失败"

      # ── 通用规则（为 T4 后续剧本预留：负载类/故障类/网络类）───────────────────
      - alert: DemoHighErrorRate
        expr: |
          sum(rate(demo_requests_total{status=~"5.."}[2m]))
            / sum(rate(demo_requests_total[2m])) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "api-gw 5xx 错误率超过 10%"
          description: "连接池打满/依赖故障导致大面积请求失败"

      - alert: DemoQueueDepthHigh
        expr: demo_queue_depth > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Celery 队列堆积超过 20 个任务"
          description: "worker 消费能力不足或被打挂（负载类/故障类剧本）"

      # for 拉长到 2m：CPU 飙高导致 /metrics 抓取偶发超时（up 短暂抖动）不应误报
      - alert: DemoApiGwDown
        expr: up{job="demo-api-gw"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "api-gw 抓取目标失联"
          description: "Prometheus 连续 2 分钟抓不到 /metrics，服务疑似挂死"

      # ── 剧本 10-cache-avalanche：任务读缓存集体失效 ────────────────────────────
      # 机制：GET /tasks/{id} 走 redis 缓存（TTL 60s），雪崩时全部转 miss 直打 DB。
      # 阈值 10/s：健康态仅 TTL 过期产生零星 miss（<1/s），雪崩态探针下数百/s。
      # 伴随信号：DB 连接池被读请求打满（DemoDbPoolSaturated 同步触发）。
      - alert: DemoCacheMissSpike
        expr: sum(rate(demo_task_cache_operations_total{result="miss"}[1m])) > 10
        for: 1m
        labels:
          severity: warning
          scenario: cache-avalanche
        annotations:
          summary: "任务读缓存未命中率骤增（疑似缓存雪崩）"
          description: "缓存集体失效导致读流量直打 DB（对应剧本 chaos/scenarios/10-cache-avalanche）"

      # ── 剧本 11-protocol-mismatch：任务滞留 pending（业务语义层）────────────────
      # 机制：版本协议不兼容时消息被正常消费、无 5xx、无资源异常，唯一信号是
      # 业务滞留——pending 超 60s 的任务数。指标日志都正常的故障只能靠业务指标告警。
      # 阈值 >5：健康态任务秒级消费完，滞留基线为 0。
      - alert: DemoTasksStuckPending
        expr: demo_tasks_stale_pending > 5
        for: 2m
        labels:
          severity: critical
          scenario: protocol-mismatch
        annotations:
          summary: "大量任务滞留 pending 超 60 秒（业务停摆，指标层无异常）"
          description: "疑似 worker 与消息协议版本不兼容，任务被消费但未处理（对应剧本 chaos/scenarios/11-protocol-mismatch）"

      # ── 剧本 12-false-positive-flap：规则阈值配置漂移型误报（D-21 / issue 06）────
      # 误报专属规则：默认阈值 0.12s 高于 /tasks P95 正常水位（轻载 ~2/s 探针实测
      # 稳定在 ~25ms，4.9 倍裕度），健康状态永不触发；剧本 inject 临时把阈值下调到
      # 0.01s（基线之下 2.5 倍），同一指标正常水位即持续越限 → 真实 Prometheus 评估
      # 链路产生的误报（非伪造 webhook payload）。阈值取 0.12 而非 0.1：避开
      # DemoHighErrorRate 已用的 0.1，保证 inject/cleanup 的 sed 替换唯一命中。
      # 注意与 slow-sql 的 DemoTasksHighLatency 正交：本规则阈值远低于其 0.5s，
      # 误报期间慢 SQL 规则不受影响。
      - alert: DemoTasksLatencyFlap
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(demo_request_duration_seconds_bucket{endpoint="/tasks"}[1m]))
          ) > 0.12
        for: 1m
        labels:
          severity: warning
          scenario: false-positive-flap
        annotations:
          summary: "/tasks P95 延迟超过 120ms（误报剧本专属规则，默认阈值正常水位不触发）"
          description: "疑似规则阈值配置漂移——先确认指标真实水位与规则变更记录，勿动系统（对应剧本 chaos/scenarios/12-false-positive-flap）"
